<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实习日记 | 公开稿</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        .article-wrap { max-width: 820px; margin: 0 auto; padding: 9rem 2rem 5rem; }
        .version-bar { display: flex; flex-wrap: wrap; gap: .8rem; align-items: center; margin: 1.2rem 0 2rem; font-size: .85rem; color: var(--text-muted); }
        .badge { padding: .15rem .7rem; border-radius: 999px; border: 1px solid var(--glass-border); font-size: .75rem; }
        .badge.ver { color: var(--primary); border-color: var(--primary); }
        .badge.warn { color: #fbbf24; border-color: #fbbf24; }
        .sec { margin-bottom: 2.2rem; padding: 1.8rem 2rem; border-radius: 1.2rem; }
        .sec h3 { color: var(--primary); margin-bottom: .8rem; font-size: 1.05rem; }
        .sec p { white-space: pre-wrap; line-height: 1.9; }
        .channel-table { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: 1rem; }
        .channel-table td, .channel-table th { padding: .6rem .8rem; border-bottom: 1px solid var(--glass-border); text-align: left; }
        .channel-table th { color: var(--text-muted); font-weight: 400; }
        .honesty { margin-top: 2rem; padding: 1.2rem 1.5rem; border-radius: 1rem; font-size: .85rem; color: var(--text-muted); border-left: 3px solid #fbbf24; }
        .progress { height: 8px; border-radius: 4px; background: rgba(255,255,255,.08); overflow: hidden; margin-top: .6rem; }
        .progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); }
        .gone { text-align: center; padding: 4rem 0; }
        .src-note { font-size: .85rem; color: var(--text-muted); margin-top: .5rem; }
        a.dl { color: var(--primary); }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    <header class="glass scrolled">
        <div class="container"><nav>
            <a href="index.html" class="logo">灵墨创意</a>
            <ul class="nav-links">
                <li><a href="index.html">首页</a></li>
                <li><a href="hobbies.html">兴趣爱好</a></li>
                <li><a href="portfolio.html">个人作品</a></li>
                <li><a href="diary.html" style="color: var(--primary);">实习日记</a></li>
                <li><a href="contact.html">联系我</a></li>
            </ul>
        </nav></div>
    </header>

    <main class="article-wrap" id="app">
        <p style="text-align:center;color:var(--text-muted);">正在加载…</p>
    </main>

    <script src="js/main.js"></script>
    <script>
        const params = new URLSearchParams(location.search);
        const id = params.get('id');
        const v = params.get('v'); // 读者固定来源版本：带 v 时绝不跳到其他版本
        const SECTIONS = [['problem','问题'],['action','行动'],['result','结果'],['reflection','反思']];
        const CH_NAMES = { search: '搜索索引', rss: 'RSS', card: '摘要卡', download: '下载文本' };
        const CH_STATUS = { published: '已发布', retracting: '撤回中', retracted: '已撤回', unpublished: '未发布' };

        function channelTable(d) {
            const rows = Object.entries(d.channels).map(([name, c]) => {
                let extra = '';
                if (name === 'search' && c.cacheStale) extra = '（摘要缓存 v' + c.cacheVersion + ' 待刷新）';
                return `<tr><td>${CH_NAMES[name]}</td><td>${c.publishedVersion ? 'v' + c.publishedVersion : '—'}</td>
                    <td>${CH_STATUS[c.status] || c.status}${extra}</td></tr>`;
            }).join('');
            let ret = '';
            if (d.retraction) {
                const pct = Math.round(d.retraction.retracted / d.retraction.total * 100);
                ret = `<p style="margin-top:1rem;font-size:.85rem;">撤回进度：${d.retraction.retracted}/${d.retraction.total} 个渠道已完成</p>
                       <div class="progress"><i style="width:${pct}%"></i></div>`;
            }
            return `<div class="sec glass"><h3>各公开渠道实际版本</h3>
                <table class="channel-table"><tr><th>渠道</th><th>实际版本</th><th>状态</th></tr>${rows}</table>${ret}
                <div class="honesty glass">${d.honesty}</div></div>`;
        }

        function render(d) {
            const pinnedBar = d.pinned
                ? `<span class="badge warn">正在查看历史版本 v${d.version}（最新为 v${d.latestVersion}，已按你的来源链接固定）</span>`
                : `<span class="badge ver">公开版本 v${d.version}</span>`;
            const work = d.work.link
                ? `<a class="dl" href="${d.work.link}">${d.work.title}</a>`
                : `${d.work.title}（来源项目已转为私密，不再提供跳转）`;
            document.getElementById('app').innerHTML = `
                <h1>${d.title}</h1>
                <div class="version-bar">${pinnedBar}
                    <span class="badge">审阅结论：${d.reviewConclusion}（${d.reviewer}）</span>
                    <a class="badge dl" href="/api/entries/${d.id}/download.txt" target="_blank">下载公开文本</a>
                </div>
                <p class="src-note">来源项目：${work} · 本页引用关系固定，不会跳转到无关项目。</p>
                ${SECTIONS.map(([k, label]) => `<section class="sec glass"><h3>${label}</h3><p>${d.sections[k] || ''}</p></section>`).join('')}
                ${channelTable(d)}`;
        }

        function renderGone(d) {
            document.getElementById('app').innerHTML = `
                <div class="gone">
                    <h1>「${d.title}」已撤回</h1>
                    <p style="color:var(--text-muted);margin:1rem 0 2rem;">该内容因来源项目转为私密正在撤回或已撤回。</p>
                    ${channelTable(d)}
                </div>`;
        }

        fetch(`/api/entries/${encodeURIComponent(id)}/public${v ? '?v=' + encodeURIComponent(v) : ''}`)
            .then(async r => {
                const d = await r.json();
                if (r.status === 410) return renderGone(d);
                if (!r.ok) throw new Error(d.error || '加载失败');
                render(d);
            })
            .catch(err => {
                document.getElementById('app').innerHTML =
                    `<p style="text-align:center;color:var(--text-muted);">无法加载：${err.message}（需启动后端：node server/server.js）</p>`;
            });
    </script>
</body>
</html>
